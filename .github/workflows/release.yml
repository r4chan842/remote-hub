name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish
        required: true
        type: string

permissions:
  contents: write
  actions: read

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  publish:
    name: Build and publish Android release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          CODE="$(date -u +%y%m%d)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (versionName=$VERSION versionCode=$CODE)"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Select Android NDK
        run: bash scripts/setup-ndk.sh

      - name: Fetch native engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-native.sh

      - name: Run the full test suite
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle :composeApp:desktopTest :composeApp:testDebugUnitTest --no-daemon; then
              break
            fi
            echo "attempt $attempt failed, retrying"
            sleep 20
            if [ "$attempt" = "3" ]; then exit 1; fi
          done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = 0
          for path in glob.glob("composeApp/build/test-results/**/*.xml", recursive=True):
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
          print(f"tests={total} failures={failures} errors={errors}")
          assert total > 0 and failures == 0 and errors == 0
          PY

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/prepare-signing.sh

      - name: Assemble release APK
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle :composeApp:assembleRelease --no-daemon \
              -PappVersionName="${{ steps.version.outputs.version }}" \
              -PappVersionCode="${{ steps.version.outputs.code }}"; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
            sleep 20
          done
          exit 1

      - name: Verify APK
        run: bash scripts/verify-apk.sh

      - name: Stage release assets
        id: assets
        run: |
          set -euo pipefail
          mkdir -p release
          APK="$(find composeApp/build/outputs/apk/release -name '*.apk' | head -1)"
          TARGET="release/RemoteHub-${{ steps.version.outputs.version }}-android.apk"
          cp "$APK" "$TARGET"
          cp build-report/apk-report.txt release/apk-report.txt
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
          echo "dir=release" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          total = 0
          for path in glob.glob("composeApp/build/test-results/**/*.xml", recursive=True):
              total += int(ET.parse(path).getroot().get("tests", 0))
          apk = glob.glob("release/*.apk")[0]
          size_mb = os.path.getsize(apk) / (1024 * 1024)
          notes = f"""## RemoteHub {os.environ['TAG']}

Android-only release. Windows is out of scope for this version.

### What is inside

- Native Kotlin + Compose Material 3 interface, Persian / English / Arabic, dark and light.
- GitHub sign-in through the official Device Authorization Flow or a personal access token, with scope validation.
- Tailscale compiled into the app with `tsnet` in userspace mode: no root, no separate client, coexists with an active system VPN.
- Remote desktop rendered by FreeRDP 3.33.1 through a JNI bridge with software GDI, graphics pipeline, RemoteFX, NSCodec and OpenH264.
- Repository, sealed secrets, workflow dispatch and live step status driven by the real GitHub API.
- Server lifecycle, operation history, re-run, expiry warnings and client-side encrypted backups in your own repository.

### Verified in this build

- {total} automated tests executed on GitHub Actions, zero failures.
- APK signed and verified with `apksigner`.
- Native libraries present for `arm64-v8a` and `armeabi-v7a`.
- Uncompressed APK size: {size_mb:.1f} MB.

### Compliance

GitHub Actions is used only for build, test, release and short orchestration. Each orchestration job is capped at 20 minutes. The remote desktop runs on a machine in your own cloud account, never on a GitHub-hosted runner.

### Install

Download the APK below and allow installation from your browser or file manager. Verify the download with `SHA256SUMS.txt`.

### First run

1. Settings → connect GitHub.
2. Network → paste a Tailscale auth key.
3. Settings → add your cloud provider token.
4. Dashboard → New server.

Full guides in three languages are built into Settings → Guides.
"""
          open("release/NOTES.md", "w").write(notes)
          print(notes)
          PY
        env:
          TAG: ${{ steps.version.outputs.tag }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RemoteHub ${{ steps.version.outputs.version }}
          body_path: release/NOTES.md
          files: |
            release/*.apk
            release/SHA256SUMS.txt
            release/apk-report.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-diagnostics
          path: |
            build-report
            composeApp/build/test-results
          retention-days: 30
