name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish
        required: true
        type: string

permissions:
  contents: write
  actions: read

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  publish:
    name: Build and publish Android release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          CODE="$(date -u +%y%m%d%H)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (versionName=$VERSION versionCode=$CODE)"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Select Android NDK
        run: bash scripts/setup-ndk.sh

      - name: Fetch native engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-native.sh

      - name: Run the full test suite
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle :composeApp:desktopTest :composeApp:testDebugUnitTest --no-daemon; then
              break
            fi
            echo "attempt $attempt failed, retrying"
            sleep 20
            if [ "$attempt" = "3" ]; then exit 1; fi
          done
          python3 scripts/test-summary.py

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/prepare-signing.sh

      - name: Assemble release APK
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle :composeApp:assembleRelease --no-daemon \
              -PappVersionName="${{ steps.version.outputs.version }}" \
              -PappVersionCode="${{ steps.version.outputs.code }}"; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
            sleep 20
          done
          exit 1

      - name: Verify APK
        run: bash scripts/verify-apk.sh

      - name: Stage release assets
        id: assets
        run: |
          set -euo pipefail
          mkdir -p release
          APK="$(find composeApp/build/outputs/apk/release -name '*.apk' | head -1)"
          TARGET="release/RemoteHub-${{ steps.version.outputs.version }}-android.apk"
          cp "$APK" "$TARGET"
          cp build-report/apk-report.txt release/apk-report.txt
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
          echo "dir=release" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python3 scripts/release-notes.py

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RemoteHub ${{ steps.version.outputs.version }}
          body_path: release/NOTES.md
          files: |
            release/*.apk
            release/SHA256SUMS.txt
            release/apk-report.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-diagnostics
          path: |
            build-report
            composeApp/build/test-results
          retention-days: 30
