name: Design Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/design.yml'

permissions:
  contents: read

concurrency:
  group: design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and Compose screen render
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          gradle-version: '8.11.1'

      - name: Install font packages required by Skia
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig libfontconfig1

      - name: Run unit tests
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle :composeApp:desktopTest --no-daemon --stacktrace; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Render every screen from real Compose code
        # 18 screens x 4 variants (fa/en/ar, light/dark, compact/expanded).
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle :composeApp:renderScreens --no-daemon --stacktrace; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Verify render output
        run: |
          set -euo pipefail
          count=$(find composeApp/build/screens -name '*.png' | wc -l)
          echo "rendered=$count"
          test "$count" -eq 72
          find composeApp/build/screens -name '*.png' -size -8k -print | tee /tmp/small.txt
          test ! -s /tmp/small.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-test-report
          path: composeApp/build/reports/tests
          if-no-files-found: warn

      - name: Upload rendered screens
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: design-screens
          path: composeApp/build/screens
          if-no-files-found: error
          retention-days: 30
