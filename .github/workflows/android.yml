# Normal CI: unit tests, Android lint and a release-type build with packaging checks.
# Runs on pull requests without repository secrets (the APK built here is signed with
# the debug key and is never published). Also reused by release.yml as its gate.
name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version_code:
        type: string
        required: false
        default: ""
      version_name:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read   # fetch-native.sh downloads artifacts of native.yml with GITHUB_TOKEN

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          gradle-version: "8.11.1"
          cache-read-only: true

      - name: Fetch native artifacts (tsbridge AAR, FreeRDP bridge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-native.sh

      - name: Unit tests
        run: gradle --no-daemon :composeApp:desktopTest :composeApp:testDebugUnitTest

      - name: Test summary
        run: python3 scripts/test-summary.py

      - name: Android lint
        run: gradle --no-daemon :composeApp:lintRelease

      - name: Build per-ABI release APKs (debug-signed, not for distribution)
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          ARGS=()
          if [ -n "${VERSION_CODE}" ]; then ARGS+=("-PappVersionCode=${VERSION_CODE}"); fi
          if [ -n "${VERSION_NAME}" ]; then ARGS+=("-PappVersionName=${VERSION_NAME}"); fi
          gradle --no-daemon :composeApp:assembleRelease "${ARGS[@]}"

      - name: Verify APKs (packaging, 16 KB alignment, size)
        run: bash scripts/verify-apk.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-reports
          path: |
            build-report/
            composeApp/build/reports/
            composeApp/build/test-results/
          retention-days: 7
