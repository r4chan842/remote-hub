name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - composeApp/**
      - gradle/**
      - scripts/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/android.yml
  workflow_run:
    workflows: [Native Engines]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  verify:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Fetch native artifacts from the native workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-native.sh

      - name: Run unit tests
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle :composeApp:desktopTest :composeApp:testDebugUnitTest --no-daemon; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
            sleep 20
          done
          exit 1

      - name: Publish test summary
        if: always()
        run: python3 scripts/test-summary.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unit-test-report
          path: composeApp/build/test-results
          retention-days: 14

  apk:
    name: Signed release APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Select Android NDK
        run: bash scripts/setup-ndk.sh

      - name: Fetch native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-native.sh

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/prepare-signing.sh

      - name: Assemble release
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle :composeApp:assembleRelease --no-daemon; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
            sleep 20
          done
          exit 1

      - name: Verify APK
        run: bash scripts/verify-apk.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remotehub-android
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/apk/release/output-metadata.json
            build-report/apk-report.txt
          retention-days: 30
