name: Native Engines

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Android ABI to build
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - both
  push:
    branches: [main]
    paths:
      - native/**
      - .github/workflows/native.yml

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false

env:
  FREERDP_VERSION: "3.33.1"
  GO_VERSION: "1.27.4"

jobs:
  tsnet:
    name: Tailscale userspace node
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Select Android NDK
        run: bash scripts/setup-ndk.sh

      - name: Resolve Go module graph
        working-directory: native/tsbridge
        run: |
          set -euo pipefail
          go mod tidy
          go mod verify
          go vet ./...

      - name: Build AAR
        working-directory: native/tsbridge
        run: bash build-aar.sh

      - name: Verify AAR contents
        working-directory: native/tsbridge
        run: |
          set -euo pipefail
          unzip -l out/tsbridge.aar
          unzip -l out/tsbridge.aar | grep -q "jni/arm64-v8a/libgojni.so"
          unzip -l out/tsbridge.aar | grep -q "classes.jar"
          mkdir -p /tmp/aar && cd /tmp/aar
          unzip -o "$GITHUB_WORKSPACE/native/tsbridge/out/tsbridge.aar" classes.jar >/dev/null
          unzip -l classes.jar | grep -q "app/remotehub/tsbridge/Tsbridge.class"
          unzip -l classes.jar | grep -q "app/remotehub/tsbridge/Node.class"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tsbridge-aar
          path: |
            native/tsbridge/out/tsbridge.aar
            native/tsbridge/go.sum
          retention-days: 14

  freerdp:
    name: FreeRDP ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install host build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake pkg-config nasm perl python3 xz-utils

      - name: Select Android NDK
        run: bash scripts/setup-ndk.sh

      - name: Fetch FreeRDP source
        run: |
          set -euo pipefail
          curl -fsSL -o freerdp.tar.gz \
            "https://github.com/FreeRDP/FreeRDP/archive/refs/tags/${FREERDP_VERSION}.tar.gz"
          echo "downloaded $(stat -c%s freerdp.tar.gz) bytes"
          mkdir -p freerdp-src
          tar -xzf freerdp.tar.gz -C freerdp-src --strip-components=1
          echo "FREERDP_SOURCE_DIR=$PWD/freerdp-src" >> "$GITHUB_ENV"
          test -f freerdp-src/client/Android/cmake/ExternalDeps.cmake

      - name: Build bridge
        env:
          ANDROID_ABI: ${{ matrix.abi }}
        run: bash native/rdpbridge/build.sh

      - name: Verify shared objects
        env:
          ANDROID_ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          OUT="native/rdpbridge/out/${ANDROID_ABI}"
          test -f "$OUT/libremotehub-rdp.so"
          test -f "$OUT/libfreerdp3.so"
          test -f "$OUT/libwinpr3.so"
          READELF="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -h "$OUT/libremotehub-rdp.so" | head -20
          "$READELF" -d "$OUT/libremotehub-rdp.so" | grep NEEDED
          NM="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D --defined-only "$OUT/libremotehub-rdp.so" | grep -c Java_app_remotehub_rdp_NativeRdp
          du -sh "$OUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rdpbridge-${{ matrix.abi }}
          path: native/rdpbridge/out/${{ matrix.abi }}/*.so
          retention-days: 14
